smart_tags_system:
  status: DONE
  notes: >
    User asked for a unified, high-quality tag system: every product needs
    10-20 labels across multiple scored realms (0-10), and the 3 fragmented
    pages (Capabilities/Behaviors/Associations) needed merging + real
    overflow fixes. Delivered: (1) extended the category-level behavior
    fabric from Air-only to all 9 categories (226 new labels, 721 new
    edges, all CANDIDATE, authored per-category not generic copy-paste);
    (2) built data/normalized/product_tag_scores.csv -- a 9-realm scoring
    engine (Space, Medium, Capability, Intelligence, Digital, Maintenance,
    Economic, Lifecycle, Job/Need) giving every one of 76 products 10-19
    scored tags (avg 14.3), each row honestly tagged RULE_DERIVED /
    ESTIMATED_JUDGMENT / CANDIDATE -- see TAG_SCORING_RULES.md for the full
    rule definitions; (3) merged Capabilities+Behaviors+Associations into
    one "Smart Tags" sidebar section with Graph and List modes, both
    genuinely distilled (top-N + expand, not raw dumps); (4) built
    TagProfile.tsx -- a per-product bar-chart visualization grouped by
    realm, shown in the product detail drawer; (5) fixed the actual root
    cause of "overflow/mess": .app had min-width:1100px forcing page-wide
    horizontal scroll below that width, and the association graph used a
    fixed-pixel SVG -- both replaced with fully responsive layout, verified
    zero horizontal overflow at 1280x720 and 1366x768; (6) added 2 new
    pytest quality gates enforcing >=10 tags/product and valid 0-10/basis
    on every row. Real official Versuni logo (exact SVG+gradient sourced
    from versuni.com's own header) added to the top bar.

smart_tags_landing_redesign:
  status: DONE
  notes: >
    User rejected the first Smart Tags cut ("terrible... too many pages
    without destillation") and asked for research into 20 real products'
    tag/attribute UX before a redesign. Dispatched a research agent that
    reviewed ~20 sites (Vivino, Steam, Oura, GitHub Topics, IMDb, Notion,
    Airtable, LinkedIn, Codility, etc.) and returned concrete patterns.
    Rebuilt the Smart Tags landing (new default "Overview" mode, Graph and
    List modes kept as-is and unmodified) around 3 of those patterns,
    genuinely wired to the real product_tag_scores data (not the older
    labels/associations graph, which uses a different, only partially
    overlapping vocabulary and has no Space/Medium/Maintenance/Economic/
    Lifecycle entries at all): (1) an Oura-style score-ring row -- one ring
    per realm, avg 0-10 score + catalog coverage % + top tag, computed live
    from all 76 products' tag arrays; (2) a Steam-style rank-weighted
    "standout tags" chip cloud across the whole catalog, size/color encoding
    weighted prominence; (3) clicking a realm ring or a standout chip opens
    a Vivino-style spectrum-bar breakdown of that realm's tags (real
    per-tag avg score + product count, computed from product_tag_scores),
    and clicking a bar drills into an actual ProductGrid of the matching
    products ranked by score. Verified live in browser: ring/cloud/bar/grid
    chain works end-to-end (Capability->Food Preparation->32 products;
    Space->Kitchen->69 products), Graph and List modes unaffected, zero
    console errors, zero horizontal overflow, npx tsc --noEmit clean,
    npm run build clean, pytest 18/18 passing.

